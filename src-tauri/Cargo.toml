[package]
name = "chirp"
version = "0.1.0"
description = "A lightweight desktop push-to-talk radio"
authors = ["meshahid973"]
license = ""
repository = "https://github.com/meshahid973/Chirp"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "chirp_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.3", features = ["tray-icon"] }
tauri-plugin-log = "2"
